# Weekly dependency updates, grouped so there are only a few PRs per week.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    ignore:
      # Python/Node version upgrades are done deliberately (CI matrix, requires-python)
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
