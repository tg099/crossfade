name: Release image

# Builds and pushes ghcr.io/<owner>/crossfade only when a GitHub release is published.
# The release tag is the single source of the version:
#   v1.2.3        → image tags 1.2.3, 1.2, latest and testing, app reports version 1.2.3
#   v1.3.0-rc.1   → 1.3.0-rc.1 and testing (pre-release: no 1.3 / latest)
# testing = newest release of any kind, so a testing install never lags behind latest.
# Order: tests → build amd64 → smoke test → vulnerability scan → multi-arch push → attestation.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # signed build provenance
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=raw,value=testing

      - name: Check release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          echo "Version: $VERSION"

      - name: Build (amd64, for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: crossfade:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name smoke -p 8765:8765 crossfade:smoke
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8765/api/health 2>/dev/null); then break; fi
            sleep 2
          done
          docker logs smoke
          echo "health: ${body:-<no answer>}"
          [ -n "$body" ] || { echo "::error::Container did not become healthy"; exit 1; }
          got=$(echo "$body" | jq -r .version)
          [ "$got" = "$VERSION" ] || { echo "::error::Image reports version '$got', expected '$VERSION'"; exit 1; }
          curl -fsS http://127.0.0.1:8765/ | grep -qi "<html" || { echo "::error::Web UI is not served"; exit 1; }
          docker rm -f smoke

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crossfade:smoke
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed GitHub attestation (verify with: gh attestation verify oci://ghcr.io/<owner>/crossfade:<tag> -R <owner>/crossfade).
      # Only available for public repositories on the Free plan.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
