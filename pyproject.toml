[project]
name = "crossfade"
version = "0.0.0"  # not maintained here: the release tag (vX.Y.Z) sets the version of the image
description = "Keeps your music collections in sync across music streaming services."
license = { file = "LICENSE" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# F/E9: errors, I: import order, B: likely bugs, UP: modern syntax for the minimum Python version
select = ["F", "E9", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are meant to be used as defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
# tests import shared pytest fixtures from test_engine and use them as parameters
"tests/*" = ["F811"]
